<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nomad Pulse - Voyage Minimaliste</title>
    <!-- Correction des liens corrompus par du formatage Markdown -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=Playfair+Display:ital@1&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #111111;
            -webkit-font-smoothing: antialiased;
        }

        .font-serif {
            font-family: 'Playfair Display', serif;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loader {
            border-top-color: #3b82f6;
            animation: spinner 0.6s linear infinite;
        }

        @keyframes spinner {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="selection:bg-black selection:text-white">

    <!-- Navigation Épurée -->
    <nav class="fixed top-0 w-full h-24 flex items-center justify-between px-8 md:px-12 z-50 bg-white/80 backdrop-blur-md border-b border-gray-50">
        <div class="text-[10px] font-black tracking-[0.4em] uppercase opacity-90 cursor-pointer" onclick="location.reload()">
            NOMAD PULSE
        </div>
        <div class="flex items-center gap-8 md:gap-12">
            <button onclick="toggleExploration(true)" class="text-[10px] font-bold tracking-widest uppercase opacity-30 hover:opacity-100 transition-all">
                Exploration
            </button>
            <button class="text-[10px] font-bold tracking-widest uppercase text-black border-b border-black pb-1">
                Itinéraire (<span id="itinerary-count">0</span>)
            </button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto pt-48 pb-32 px-6 md:px-10">
        
        <!-- Hero Section -->
        <section class="mb-24">
            <h1 class="text-5xl md:text-6xl font-light tracking-tighter leading-tight mb-16">
                Préparez votre voyage <br />
                <span class="italic font-serif text-gray-300 underline decoration-gray-100 underline-offset-8">en toute clarté</span>.
            </h1>

            <!-- Tabs de catégories -->
            <div class="flex gap-8 md:gap-10 mb-10 border-b border-gray-50 pb-4">
                <button onclick="setCategory('vols')" id="tab-vols" class="category-tab text-[9px] font-black uppercase tracking-[0.25em] text-black border-b-2 border-black pb-4 -mb-[18px] transition-all">vols</button>
                <button onclick="setCategory('hotels')" id="tab-hotels" class="category-tab text-[9px] font-black uppercase tracking-[0.25em] text-gray-300 hover:text-gray-500 transition-all">hotels</button>
                <button onclick="setCategory('voitures')" id="tab-voitures" class="category-tab text-[9px] font-black uppercase tracking-[0.25em] text-gray-300 hover:text-gray-500 transition-all">voitures</button>
            </div>

            <!-- Formulaire de recherche -->
            <form id="search-form" class="flex flex-col md:flex-row gap-6 items-end">
                <div id="origin-container" class="flex-1 w-full group">
                    <label class="text-[9px] font-black uppercase tracking-widest text-gray-400 mb-2 block group-focus-within:text-black transition-colors">Origine</label>
                    <input type="text" id="input-origin" placeholder="Ville de départ" class="w-full text-xl font-light border-b border-gray-100 py-3 focus:outline-none focus:border-black transition-all">
                </div>
                <div class="flex-1 w-full group">
                    <label id="destination-label" class="text-[9px] font-black uppercase tracking-widest text-gray-400 mb-2 block group-focus-within:text-black transition-colors">Destination</label>
                    <input type="text" id="input-destination" placeholder="Ville d'arrivée" class="w-full text-xl font-light border-b border-gray-100 py-3 focus:outline-none focus:border-black transition-all">
                </div>
                <button type="submit" id="search-btn" class="bg-black text-white w-14 h-14 rounded-full flex items-center justify-center hover:scale-105 active:scale-95 transition-all shadow-xl shadow-gray-200 shrink-0">
                    <i data-lucide="search" class="w-5 h-5"></i>
                </button>
            </form>
        </section>

        <!-- Zone de contenu dynamique -->
        <div id="content-area" class="space-y-16">
            <!-- Les résultats seront injectés ici -->
        </div>
    </main>

    <!-- Panneau d'Exploration -->
    <div id="exploration-panel" class="fixed inset-0 bg-white/95 backdrop-blur-md z-[60] p-8 md:p-12 hidden">
        <div class="max-w-4xl mx-auto pt-24">
            <div class="flex justify-between items-center mb-16">
                <h2 class="text-4xl font-light tracking-tighter">Exploration</h2>
                <button onclick="toggleExploration(false)"><i data-lucide="x" class="w-8 h-8 opacity-50"></i></button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8" id="trending-container">
                <!-- Les offres tendances sont injectées ici -->
            </div>
        </div>
    </div>

    <!-- Itinéraire Flottant -->
    <div id="itinerary-panel" class="fixed bottom-10 right-10 left-10 md:left-auto md:w-[400px] bg-black text-white rounded-[3rem] p-8 md:p-10 shadow-2xl z-50 hidden fade-in">
        <div class="flex justify-between items-center mb-8">
            <h4 class="text-[9px] font-black tracking-[0.3em] uppercase text-gray-500">Mon Voyage</h4>
            <button onclick="clearItinerary()" class="p-2 hover:bg-white/10 rounded-full"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div id="itinerary-items" class="space-y-6 mb-10 max-h-40 overflow-y-auto pr-2 scrollbar-hide">
            <!-- Éléments de l'itinéraire -->
        </div>
        <button class="w-full bg-blue-600 text-white py-6 rounded-[2rem] font-bold text-[9px] uppercase tracking-[0.3em] hover:bg-blue-700 transition-all flex items-center justify-center gap-3">
            Finaliser la réservation <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
    </div>

    <script>
        // --- Configuration ---
        const apiKey = ""; 
        let activeCategory = 'vols';
        let itinerary = [];
        const trendingDeals = [
            { from: "Cotonou", to: "Lomé", price: "45k CFA", type: "vols" },
            { from: "Paris", to: "Lisbonne", price: "29€", type: "vols" },
            { from: "Abidjan", to: "Dakar", price: "120k CFA", type: "vols" }
        ];

        // Fonction sécurisée pour créer des icônes
        function safeCreateIcons() {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        }

        // --- Fonctions Coeur ---

        function setCategory(cat) {
            activeCategory = cat;
            
            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.classList.remove('text-black', 'border-b-2', 'border-black', 'pb-4', '-mb-[18px]');
                tab.classList.add('text-gray-300');
            });
            const activeTab = document.getElementById(`tab-${cat}`);
            activeTab.classList.add('text-black', 'border-b-2', 'border-black', 'pb-4', '-mb-[18px]');
            activeTab.classList.remove('text-gray-300');

            const originContainer = document.getElementById('origin-container');
            const destLabel = document.getElementById('destination-label');
            if (cat === 'vols') {
                originContainer.style.display = 'block';
                destLabel.textContent = 'Destination';
            } else {
                originContainer.style.display = 'none';
                destLabel.textContent = cat === 'hotels' ? 'Lieu de séjour' : 'Lieu de location';
            }

            document.getElementById('content-area').innerHTML = '';
        }

        function cleanJsonResponse(text) {
            try {
                const jsonMatch = text.match(/\{[\s\S]*\}/);
                return jsonMatch ? JSON.parse(jsonMatch[0]) : JSON.parse(text);
            } catch (e) {
                console.error("Erreur de parsing JSON:", e);
                return null;
            }
        }

        async function performSearch(e, customData = null) {
            if (e) e.preventDefault();
            
            const origin = customData ? customData.from : document.getElementById('input-origin').value;
            const dest = customData ? customData.to : document.getElementById('input-destination').value;
            
            if (activeCategory === 'vols' && (!origin || !dest)) return;
            if (activeCategory !== 'vols' && !dest) return;

            showLoading(true);
            toggleExploration(false);

            let searchPrompt = "";
            if (activeCategory === 'vols') {
                searchPrompt = `Vols économiques de ${origin} vers ${dest}.`;
            } else if (activeCategory === 'hotels') {
                searchPrompt = `Hôtels les moins chers à ${dest}.`;
            } else {
                searchPrompt = `Locations de voitures budget à ${dest}.`;
            }

            const systemPrompt = `Tu es l'intelligence de Nomad Pulse. 
            RETOURNE UNIQUEMENT un objet JSON pur :
            {
                "items": [{"id": "unique_id", "title": "Nom de l'offre", "price": "Prix", "detail": "Description", "meta": "Info contextuelle"}],
                "advice": "Conseil court stratégique"
            }`;

            const callApi = async (useSearchTool) => {
                const payload = {
                    contents: [{ parts: [{ text: `Recherche des ${activeCategory} pour : ${searchPrompt}` }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    generationConfig: { responseMimeType: "application/json" }
                };

                if (useSearchTool) {
                    payload.tools = [{ "google_search": {} }];
                }

                const response = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!text) throw new Error("Réponse vide");
                
                const result = cleanJsonResponse(text);
                if (!result || !result.items) throw new Error("Format JSON invalide");

                return result;
            };

            try {
                const result = await callApi(true);
                renderResults(result);
            } catch (err) {
                console.warn("Fallback...", err);
                try {
                    const fallbackResult = await callApi(false);
                    renderResults(fallbackResult);
                } catch (fallbackErr) {
                    renderError("Impossible d'obtenir les tarifs. Veuillez réessayer.");
                }
            } finally {
                showLoading(false);
            }
        }

        async function fetchWithRetry(url, options, retries = 5, backoff = 1000) {
            try {
                const res = await fetch(url, options);
                if (!res.ok) throw new Error('Status: ' + res.status);
                return res;
            } catch (err) {
                if (retries > 0) {
                    await new Promise(r => setTimeout(r, backoff));
                    return fetchWithRetry(url, options, retries - 1, backoff * 2);
                }
                throw err;
            }
        }

        function renderResults(data) {
            const container = document.getElementById('content-area');
            let html = '';

            if (data.advice) {
                html += `
                <div class="bg-black text-white p-10 rounded-[3rem] flex gap-6 items-start shadow-2xl fade-in">
                    <i data-lucide="trending-down" class="mt-1 shrink-0 text-blue-400 w-5 h-5"></i>
                    <div>
                        <h4 class="text-[9px] font-black uppercase tracking-widest text-gray-500 mb-2">Pulse Insight</h4>
                        <p class="text-base font-light leading-relaxed">${data.advice}</p>
                    </div>
                </div>`;
            }

            html += `<div class="grid gap-6"><h2 class="text-[10px] font-black uppercase tracking-[0.3em] text-gray-300 mb-2">Résultats trouvés</h2>`;

            data.items.forEach(item => {
                html += `
                <div class="group flex flex-col md:flex-row md:items-center justify-between p-8 bg-white border border-gray-100 rounded-[2.5rem] hover:border-black transition-all duration-500 fade-in">
                    <div class="flex-1">
                        <div class="text-[9px] font-bold text-blue-600 uppercase tracking-widest mb-3">${item.meta || 'Meilleur Tarif'}</div>
                        <h3 class="text-xl font-medium tracking-tight mb-1">${item.title}</h3>
                        <p class="text-gray-400 text-xs font-light">${item.detail}</p>
                    </div>
                    <div class="flex items-center gap-10 mt-6 md:mt-0">
                        <div class="text-right">
                            <span class="text-[9px] font-bold text-gray-200 uppercase tracking-widest block mb-0.5">Pulse Price</span>
                            <div class="text-3xl font-light tracking-tighter">${item.price}</div>
                        </div>
                        <button onclick='addToItinerary(${JSON.stringify(item).replace(/'/g, "&apos;")})' class="w-12 h-12 rounded-full border border-gray-100 flex items-center justify-center hover:bg-black hover:text-white transition-all duration-300">
                            <i data-lucide="chevron-right" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>`;
            });

            html += `</div>`;
            container.innerHTML = html;
            safeCreateIcons();
        }

        function showLoading(isLoading) {
            const btn = document.getElementById('search-btn');
            if (isLoading) {
                btn.innerHTML = `<div class="loader w-5 h-5 border-2 border-white rounded-full"></div>`;
                btn.disabled = true;
                document.getElementById('content-area').innerHTML = `
                    <div class="py-20 text-center space-y-6 fade-in">
                        <div class="loader w-10 h-10 border-2 border-gray-100 rounded-full mx-auto"></div>
                        <p class="text-[10px] font-black uppercase tracking-widest text-gray-300">Analyse du marché...</p>
                    </div>
                `;
            } else {
                btn.innerHTML = `<i data-lucide="search" class="w-5 h-5"></i>`;
                btn.disabled = false;
                safeCreateIcons();
            }
        }

        function renderError(msg) {
            document.getElementById('content-area').innerHTML = `
                <div class="flex flex-col items-center py-20 fade-in">
                    <div class="bg-red-50 text-red-500 p-8 rounded-[3rem] border border-red-100 text-sm max-w-md text-center">
                        <i data-lucide="info" class="mx-auto mb-4 w-6 h-6"></i>
                        ${msg}
                    </div>
                </div>
            `;
            safeCreateIcons();
        }

        function addToItinerary(item) {
            if (itinerary.find(i => i.id === item.id)) return;
            itinerary.push({...item, type: activeCategory});
            updateItineraryUI();
        }

        function removeFromItinerary(id) {
            itinerary = itinerary.filter(i => i.id !== id);
            updateItineraryUI();
        }

        function clearItinerary() {
            itinerary = [];
            updateItineraryUI();
        }

        function updateItineraryUI() {
            const panel = document.getElementById('itinerary-panel');
            const list = document.getElementById('itinerary-items');
            const count = document.getElementById('itinerary-count');

            count.textContent = itinerary.length;

            if (itinerary.length > 0) {
                panel.classList.remove('hidden');
                let html = '';
                itinerary.forEach(item => {
                    html += `
                    <div class="flex justify-between items-end border-b border-white/5 pb-4">
                        <div>
                            <p class="text-[8px] font-bold text-blue-500 uppercase tracking-widest mb-1">${item.type}</p>
                            <p class="text-sm font-medium">${item.title}</p>
                        </div>
                        <div class="flex items-center gap-4">
                            <span class="text-lg font-light">${item.price}</span>
                            <button onclick="removeFromItinerary('${item.id}')" class="opacity-30 hover:opacity-100"><i data-lucide="x" class="w-3 h-3"></i></button>
                        </div>
                    </div>`;
                });
                list.innerHTML = html;
                safeCreateIcons();
            } else {
                panel.classList.add('hidden');
            }
        }

        function toggleExploration(show) {
            const panel = document.getElementById('exploration-panel');
            const container = document.getElementById('trending-container');
            
            if (show) {
                panel.classList.remove('hidden');
                let html = '';
                trendingDeals.forEach(deal => {
                    html += `
                    <button onclick='handleDeal(${JSON.stringify(deal).replace(/'/g, "&apos;")})' class="p-10 bg-gray-50 rounded-[3rem] text-left hover:scale-[1.02] transition-all group">
                        <p class="text-[9px] font-black uppercase text-gray-300 mb-4 group-hover:text-blue-500">${deal.type}</p>
                        <p class="text-2xl font-light mb-4">${deal.from} → ${deal.to}</p>
                        <p class="text-blue-600 font-bold">Dès ${deal.price}</p>
                    </button>`;
                });
                container.innerHTML = html;
                safeCreateIcons();
            } else {
                panel.classList.add('hidden');
            }
        }

        function handleDeal(deal) {
            setCategory(deal.type);
            document.getElementById('input-origin').value = deal.from || '';
            document.getElementById('input-destination').value = deal.to;
            performSearch(null, deal);
        }

        document.getElementById('search-form').addEventListener('submit', performSearch);
        
        // Initialisation au chargement
        window.onload = function() {
            setCategory('vols');
            safeCreateIcons();
        };

    </script>
</body>
</html>
